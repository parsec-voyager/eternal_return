schema_version = "1.0.0"

id = "eternal_return"
version = "0.1.0"
name = "Eternal Return"
tagline = "Fly an FPV drone through endless scale"
maintainer = "parsec-voyager"
type = "add-on"

website = "https://github.com/parsec-voyager/eternal_return"

tags = ["Camera", "Animation"]

blender_version_min = "5.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 parsec-voyager",
]

# The platforms with both a core wheel (built by eternal_return_core's CI) and an SDL wheel. Not windows-arm64: SDL2
# ships no Windows-on-ARM library, so the controller couldn't be read there. Not macos-x64: Blender 5 dropped Intel Macs.
platforms = ["macos-arm64", "windows-x64", "linux-x64"]

wheels = [
  "./wheels/pysdl2_dll-2.30.10-py2.py3-none-macosx_10_11_universal2.whl",
  "./wheels/pysdl2_dll-2.30.10-py2.py3-none-manylinux_2_28_x86_64.whl",
  "./wheels/pysdl2_dll-2.30.10-py2.py3-none-win_amd64.whl",
  "./wheels/PySDL2-0.9.17-py3-none-any.whl",
  "./wheels/eternal_return_core-0.4.0-cp311-abi3-macosx_11_0_arm64.whl",
  "./wheels/eternal_return_core-0.4.0-cp311-abi3-manylinux_2_28_x86_64.whl",
  "./wheels/eternal_return_core-0.4.0-cp311-abi3-win_amd64.whl"
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "venv/",
  "tests/",
  "media/",
  "/.git/",
  "/*.zip",
  "*.blend1",
  "/mouse_move.py",
  "/install.sh"
]
